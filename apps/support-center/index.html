<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Support Center — X Orbit</title>
    <meta
      name="description"
      content="Open a support ticket for X Orbit: report a bug, ask a question or request a feature."
    />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/config.js" defer></script>
    <script src="/firebase-config.js" defer></script>
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <button class="skip" id="skip" type="button">Skip to the content</button>
    <header class="top">
      <div class="wrap bar">
        <a class="brand" href="https://xorbit-browse.vercel.app" aria-label="X Orbit website">
          <img src="/favicon.svg" alt="" width="22" height="22" />
          <span>X ORBIT</span>
        </a>
        <nav id="nav" aria-label="Primary"></nav>
      </div>
    </header>

    <main id="app" class="wrap" tabindex="-1"><p class="hint">Loading...</p></main>
    <noscript
      ><p class="wrap banner">
        The Support Center needs JavaScript to sign you in and show your tickets.
      </p></noscript
    >

    <footer class="wrap foot">
      <span class="label">X ORBIT · SUPPORT CENTER</span>
      <span class="label">CHANNEL / BETA</span>
    </footer>
  </body>
</html>
