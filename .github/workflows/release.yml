# Manual only. X Orbit's Mac builds are made on the maintainer's Mac (signed with a local certificate the updater requires);
# the Windows installer comes from windows.yml. This generic workflow is kept for a future fully-CI release.
# Secrets are optional: without them the builds are unsigned (see docs/distribution.md).
name: Release
on:
  workflow_dispatch: # manual only: Mac releases are built and signed locally, Windows has its own workflow (windows.yml)
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orbit/browser build
        env:
          MAIN_VITE_FIREBASE_KEY: ${{ secrets.FIREBASE_DESKTOP_KEY }}
      - name: Package and publish
        working-directory: apps/browser
        run: pnpm exec electron-builder --config electron-builder.config.cjs --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORBIT_GH_OWNER: ${{ github.repository_owner }}
          # the desktop app's sign-in key (Identity Toolkit + Token Service only); a repository secret, not in the repo
          MAIN_VITE_FIREBASE_KEY: ${{ secrets.FIREBASE_DESKTOP_KEY }}
          ORBIT_GH_REPO: ${{ github.event.repository.name }}
          # macOS signing + notarization (optional)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing (optional)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
  # Only the newest release per channel stays listed (newest stable + newest pre-release); older ones are removed.
  prune:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete older releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease | jq -r '
            ([.[] | select(.isPrerelease == false)][1:][].tagName),
            ([.[] | select(.isPrerelease)][1:][].tagName)' |
            xargs -r -n1 gh release delete --yes
